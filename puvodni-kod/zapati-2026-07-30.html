<style>
  /* 1) FIX PROTI SKÁKÁNÍ DO STRAN (MOBIL I PC) */
  html, body {
    width: 100%;
    margin: 0;
    padding: 0;
    /* overflow-x: hidden je bezpečnější než clip pro interaktivní prvky */
    overflow-x: hidden;
    position: relative;
  }

  /* 2) GALERIE A MINIATURY (SHOPTET SPECIFICKÉ) */
  /* Zabrání tomu, aby se malé náhledy roztáhly na celou šířku */
  .p-detail .p-thumbnails img,
  .product-gallery .thumbnails img,
  .swiper-slide img,
  .slick-slide img {
    width: auto !important;
    max-width: 100%;
    height: auto;
    display: inline-block;
  }

  /* 3) ZÁCHRANA ROLETEK A MENU */
  /* Na desktopu musí menu "přetékat", aby bylo vidět */
  @media (min-width: 769px) {
    .navigation-wrapper,
    #navigation,
    .menu-helper,
    .dropdown-menu,
    .categories-menu {
      overflow: visible !important;
    }
  }

  /* 4) ÚPRAVA SLIDERŮ */
  .swiper-wrapper, .slick-track {
    width: auto;
  }
</style>

<script>
  (function() {
    const fixMobileOverflow = () => {
      // Pokud jsme na PC (šířka nad 992px), nebudeme skriptem agresivně řezat prvky
      // To vyřeší tvůj problém s neviditelnými roletkami
      if (window.innerWidth > 992) {
        return;
      }

      // Selektory, na které skript nesmí sahat (galerie a navigace)
      const protectedElements = [
        '.gallery', '.product-gallery', '.p-detail',
        '.navigation-wrapper', '#navigation', '.swiper-container'
      ].join(', ');

      // Vybereme hlavní bloky obsahu, které nejčastěji způsobují "skákání" do stran
      const containers = document.querySelectorAll('section, div.container, header, footer, table');

      containers.forEach(el => {
        // Pokud je prvek chráněný, přeskoč ho
        if (el.closest(protectedElements)) return;

        // Pokud prvek fyzicky přesahuje šířku obrazovky, zkrotíme ho
        if (el.offsetWidth > window.innerWidth) {
          el.style.maxWidth = '100%';
          el.style.boxSizing = 'border-box';
          el.style.overflowX = 'hidden';
        }
      });
    };

    // Spuštění po načtení a při změně velikosti okna
    window.addEventListener('load', fixMobileOverflow);

    let t;
    window.addEventListener('resize', () => {
      clearTimeout(t);
      t = setTimeout(fixMobileOverflow, 150);
    });
  })();
</script>
