<script>
(function () {
    function getDirectText(el) {
        return (el.textContent || "").replace(/\s+/g, " ").trim();
    }

    function findTabsBlock() {
        var nodes = document.querySelectorAll("div, section, ul, nav");
        for (var i = 0; i < nodes.length; i++) {
            var txt = getDirectText(nodes[i]);
            if (
                txt.indexOf("Doporučené") > -1 &&
                txt.indexOf("Akční zboží") > -1 &&
                txt.indexOf("Novinky") > -1 &&
                txt.length < 300
            ) {
                return nodes[i];
            }
        }
        return null;
    }

    function moveCard() {
        var card = document.getElementById("cls-owner-move");
        if (!card || card.dataset.done === "1") return;

        var tabs = findTabsBlock();
        if (!tabs) return;

        var insertTarget = tabs;
        while (
            insertTarget.parentElement &&
            insertTarget.parentElement !== document.body &&
            insertTarget.parentElement.children.length === 1
        ) {
            insertTarget = insertTarget.parentElement;
        }

        insertTarget.parentNode.insertBefore(card, insertTarget);
        card.style.display = "flex";
        card.dataset.done = "1";
    }

    document.addEventListener("DOMContentLoaded", function () {
        moveCard();

        var tries = 0;
        var timer = setInterval(function () {
            moveCard();
            tries++;
            if (document.getElementById("cls-owner-move")?.dataset.done === "1" || tries > 20) {
                clearInterval(timer);
            }
        }, 300);
    });
})();
</script>
